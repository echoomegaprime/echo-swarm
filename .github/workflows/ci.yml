name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test Node contracts
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            systems/echo_swarm_brain/requirements.txt
            systems/echo_maximalist_fusion/requirements.txt

      - name: Install Python dependencies
        run: pip install -r systems/echo_swarm_brain/requirements.txt -r systems/echo_maximalist_fusion/requirements.txt

      - name: Test Echo Swarm Brain
        run: python -m pytest systems/echo_swarm_brain/tests -q

      - name: Test Maximalist Fusion
        run: |
          python systems/echo_maximalist_fusion/tests/test_invariants.py
          python systems/echo_maximalist_fusion/tests/test_worker.py
          python systems/echo_maximalist_fusion/tests/test_live_adapters.py
          PYTHONPATH=systems/echo_maximalist_fusion/src python -m pytest systems/echo_maximalist_fusion/tests/test_review_regressions.py -q

      - name: Verify CertForge journey
        run: python -B scripts/certforge_journey.py
